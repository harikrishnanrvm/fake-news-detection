<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake News Detection Using Deep Learning</title>
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
>
<style>
  body {
    background-color: #f5f6f8;
  }
  .app-card {
    max-width: 720px;
    margin: 40px auto;
  }
  #resultSection {
    display: none;
  }
  #errorAlert {
    display: none;
  }
  #predictionBadge {
    font-size: 1.25rem;
  }
</style>
</head>
<body>

<div class="container app-card">
  <div class="text-center mb-4">
    <h1 class="h3">Fake News Detection Using Deep Learning</h1>
    <p class="text-muted">Paste a news article below and check whether it looks Real or Fake.</p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <label for="articleText" class="form-label fw-semibold">Paste News Article</label>
      <textarea
        id="articleText"
        class="form-control"
        rows="10"
        placeholder="Paste the full news article text here (at least 50 characters)..."
      ></textarea>

      <div class="d-flex justify-content-center gap-2 mt-3">
        <button id="predictBtn" type="button" class="btn btn-primary px-4">Predict</button>
        <button id="clearBtn" type="button" class="btn btn-outline-secondary px-4">Clear</button>
      </div>

      <div id="errorAlert" class="alert alert-danger mt-3 mb-0" role="alert"></div>

      <hr class="my-4">

      <div id="resultSection">
        <div class="row text-center">
          <div class="col-4">
            <div class="text-muted small text-uppercase">Prediction</div>
            <div id="predictionBadge" class="fw-bold mt-1">-</div>
          </div>
          <div class="col-4">
            <div class="text-muted small text-uppercase">Confidence</div>
            <div id="confidenceValue" class="fw-bold mt-1">-</div>
          </div>
          <div class="col-4">
            <div class="text-muted small text-uppercase">Model</div>
            <div id="modelValue" class="fw-bold mt-1">-</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <p class="text-center text-muted small mt-3">
    BCA Major Project - Fake News Detection using Deep Learning (LSTM).
    This tool is for academic demonstration only.
  </p>
</div>

<script src="/static/script.js"></script>
</body>
</html>
